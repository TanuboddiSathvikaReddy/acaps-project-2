<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ACAPS: a simulation platform for understanding how adaptive packet scheduling behaves under changing network conditions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ACAPS — Adaptive Context-Aware Packet Scheduling</title>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
